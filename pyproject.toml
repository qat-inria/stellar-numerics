[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-numerics"
authors = [{ name = "Maxime Garnier", email = "maxime.garnier@inria.fr" }, { name = "Ulysse Chabaud", email = "ulysse.chabaud@inria.fr" }]
maintainers = [{ name = "Maxime Garnier", email = "maxime.garnier@inria.fr" }, { name = "Ulysse Chabaud", email = "ulysse.chabaud@inria.fr" }]

license-files = ["LICENSE"]
description = "stellar-rank optimisation"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[project.urls]
Documentation = ""
"Bug Tracker" = "https://gitlab.inria.fr/qat/stellar-numerics/-/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[tool.ruff]
line-length = 120
extend-exclude = ["docs"]