stages:
# test already exist by default
# deploy too
  - test
  - benchmark
  # - deploy

# common stuff and actions

image: python:3.13

before_script:
    - pip install -r requirements.txt

test:
  stage: test
  tags:
    - ci.inria.fr # For using shared runners
    - small       # For selecting small shared runners
# remove. will run as soon as there is an event on the BRANCH
# ci ppelines are branch based
  # rules:
  #   - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - pytest

benchmark:
  stage: benchmark
  script:
    - asv run
    - asv publish
  artifacts:
    paths:
      - .asv/html
