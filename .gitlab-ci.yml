# gitlab: repo toujours en checkout
# each job is in a fresh vm!
include:
  - project: "inria-ci/docker"
    file: "/register-dockerfile/register-dockerfile.yml"

stages:
  # test already exist by default
  # deploy too
  - test
  # - benchmark
  # - deploy

prepare:
  before_script: []
  rules:
    - changes:
        - Dockerfile
        - environment.yml
        - requirements.txt
  extends: .register-dockerfile-prepare

image: $image

# common stuff and actions
# how to specify multiple python versions? matrix?
default:
  before_script:
    - . ~/.bashrc
    - conda activate stellar-numerics
  tags:
    - ci.inria.fr # For using shared runners
    - large # For selecting large shared runners. Needed for big tests

test:
  stage: test
  # remove. will run as soon as there is an event on the BRANCH
  # ci pipelines are branch based
  # rules:
  #   - if: $CI_PIPELINE_SOURCE == "push"
  script:
  # all tests in their own threads if --isolate
    - pytest #--isolate

