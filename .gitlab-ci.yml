# gitlab: repo toujours en checkout
# each job is in a fresh vm!

stages:
  # test already exist by default
  # deploy too
  - test
  - benchmark
  # - deploy

# common stuff and actions
# how to specify multiple python versions? matrix?
image: conda/miniconda3
# voir image thierry. Docker shared par toutes les vm donc créer une seule fois. Look at Docker.
default:
  tags:
    - ci.inria.fr # For using shared runners
    - small # For selecting small shared runners
  before_script:
    - conda init bash
    - . ~/.bashrc
    - conda env create -f environment.yml
    - conda activate stellar-numerics

test:
  stage: test
  # remove. will run as soon as there is an event on the BRANCH
  # ci pipelines are branch based
  # rules:
  #   - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - pytest

benchmark:
  stage: benchmark
  script:
    - asv machine --yes
    - asv run ALL
    - asv publish
  artifacts:
    paths:
      - .asv/html

pages: 
  needs: [benchmark]
  dependencies:
    - benchmark # par défaut en parallèle donc besoin de spécifier la dependance. Après et beosin des artefacts.
  stage: benchmark
  script:
    - mv .asv/html public
  artifacts:
    paths:
      - public
  only:
    - main
# activate gitlab pages
# public is created in the pages job above.
