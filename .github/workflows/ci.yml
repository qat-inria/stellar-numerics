# .github/workflows/ci.yml
name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  python-version: "3.13"

# add matrix later for os and python version
jobs:
  lint-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Linter
        run: ruff check --output-format=github stellar/ tests/

  mypy-pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: mypy stellar/ tests/

      - run: pyright stellar/ tests/
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Formatter Check
        run: ruff format --check stellar/ tests/



# mypy  pyright later
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest
